name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Test core
        run: go test -race ./...

      - name: Test macOS models
        run: bash macos/test-models.sh

      - name: Build all platforms
        run: make build-all VERSION=${GITHUB_REF_NAME}

      - name: Build macOS DMG
        run: make dmg VERSION=${GITHUB_REF_NAME}

      - name: Export Agent Skill
        run: make skill VERSION=${GITHUB_REF_NAME}

      - name: Checksum release assets
        working-directory: dist
        run: shasum -a 256 gateway-* *.dmg *.zip > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: docs/releases/latest.md
          files: |
            dist/gateway-*
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
