# lan-proxy-gateway v4 配置文件
# 所在目录: ~/.config/lan-proxy-gateway/gateway.yaml
# 首次运行 `gateway` 会自动走初始化向导生成本文件，通常无需手动编辑。
#
# v4 架构：设备把 网关+DNS 指向本机即接入；出口要么直连本机网络，
# 要么走一个上游代理（socks5/http）。需要 VLESS/订阅等协议时，
# 在本机跑 clash / sing-box，把它的本地端口填为上游代理即可。

version: 4

# ========== 局域网网关 ==========
gateway:
  enabled: true

# ========== 出口 ==========
egress:
  mode: direct             # direct | proxy
  proxy:                   # mode=proxy 时使用；恰好一个上游
    type: socks5           # socks5 | http
    host: 127.0.0.1
    port: 7897
    username: ""
    password: ""

# ========== DNS 服务 ==========
dns:
  enabled: true
  port: 53
  upstreams: ["223.5.5.5", "119.29.29.29"]
  # 代理模式返回 fake-IP，让 relay 把原始域名交给 Clash/sing-box 解析和分流。
  fake_ip: true
  # 不劫持设备发往其他 DNS 的查询，避免部分 Android/ColorOS 浏览器异常。
  hijack: false
  # 追加不做 fake-ip 的域名后缀（内置: lan/local/localhost/internal/home.arpa）
  fake_ip_filter: []

# QUIC(UDP/443) 拦截：代理模式下拒绝 QUIC 迫使浏览器回退 TCP（否则 QUIC 直连绕过代理）
quic_block: true

# ========== Runtime（通常不用改）==========
runtime:
  redir_port: 17892        # 透明 TCP 转发监听端口
  udp_redir_port: 17893    # UDP fake-IP 转发端口（游戏语音/视频通话）
  api_port: 19090          # 本机回环状态 API（配置热加载）
  log_level: info
  fake_ip_range: "198.18.0.0/16"
